<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>学祭レジシステム - レジ</title>
  <link rel="stylesheet" href="stylesheet.css">
  <link rel="stylesheet" href="style_cashier.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

  <div class="header">
    <div class="header-left">
      <h1>レジ画面</h1>
      <div class="toggle-container">
        <div id="registerButtons"></div>
      </div>
    </div>
    <a href="top.html" class="btn-back">← トップに戻る</a>
  </div>

  <div class="grid-container" id="gridContainer"></div>

  <div class="footer-area">
    <button class="btn-reset" onclick="resetApp()">リセット</button>
    <button class="btn-gacha-loop" onclick="triggerGachaLoop()">マスガチャループ</button>

    <div class="other-item-container">
      <span class="other-label">その他:</span>
      <input type="text" class="input-other-name" id="inputOtherName" placeholder="商品名を入力" maxlength="20">
      <input type="number" class="input-other-price" id="inputOtherPrice" oninput="validateOtherPrice()"
        placeholder="0">
      <span class="other-unit">円</span>
    </div>

    <div class="footer-bar">
      <div class="footer-right">
        <div class="total-price-container">
          <span class="total-price-label">合計金額</span>
          <span class="total-price-amount">0円</span>
        </div>
        <button class="btn-checkout" onclick="openModal()">会計</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-window">
      <p class="modal-title">💰 会計確認</p>

      <div class="modal-calc-row" style="color: #4a5568; font-size: 16px; margin-bottom: -5px;">
        <span>担当レジ</span>
        <span id="modalRegisterType" style="color: #333333; font-weight: bold;">--レジ</span>
      </div>

      <div class="modal-receipt-area" id="modalReceiptList"></div>

      <div class="modal-calc-row">
        <span>合計金額</span>
        <span id="modalTotalAmount">0円</span>
      </div>

      <div class="modal-calc-row">
        <span>お預かり</span>
        <div>
          <input type="number" class="input-money" id="inputDeposit" oninput="calcChange()"
            onkeydown="blockInvalidKeys(event)" placeholder="0"> 円
        </div>
      </div>

      <div class="modal-calc-row" style="border-top: 2px dashed #e2e8f0; padding-top: 15px;">
        <span>お釣り</span>
        <span class="change-amount" id="modalChangeAmount">0円</span>
      </div>

      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeModal()">戻る</button>
        <button class="btn-modal-confirm" id="btnConfirmPayment" onclick="submitPayment()">会計を確定</button>
      </div>
    </div>
  </div>

  <div id="toastMessage" class="toast-message">お会計が完了しました！</div>

  <script>
    
    // ====================
    //   グローバル変数
    // ====================
    
    // レジ画面に表示する商品情報（display_slotsテーブルから読み込み）
    let ITEM_MASTER = {};

    // 利用可能なレジ一覧（registersテーブルから読み込み）
    let registers = [];
    
    // 現在選択中のレジID
    let currentRegisterId = null;

    //現在の合計金額
    let currentTotal = 0;

    // マスガチャ割引計算で特別扱いする商品のスロットID
    const SPECIAL_ITEMS = {
      GACHA: "item_13",
      DISCOUNT_100: "item_14",
      DISCOUNT_200: "item_15",
      DISCOUNT_300: "item_16"
    };

    // Supabase接続用クライアント
    const mySupabase = window.supabase.createClient(
      CONFIG.SUPABASE_URL,
      CONFIG.SUPABASE_KEY
    );

    
    // ====================
    //   ページ初期化
    // ====================

    // ページ初期化処理（ページのロード時に実行）
    window.onload = async () => {

      // 未ログインの場合はログイン画面へ戻す
      const {
        data: { session }
      } = await mySupabase.auth.getSession();
      if (!session) {
        location.href = "login.html";
        return;
      }

      // 商品情報・レジ情報を取得して画面を生成
      await loadDisplaySlots();
      await loadRegisters();
      createRegisterButtons();
      initApp();
    };

    
    // ====================
    //   データ取得
    // ====================

    //display_slotsテーブルから表示商品の設定を取得し、ITEM_MASTERを構築する
    async function loadDisplaySlots() {

      const { data, error } =
        await mySupabase
          .from('display_slots')
          .select(`
        slot_id,
        product_id,
        products (
          product_name,
          current_price
        )
      `)
          .order('slot_id');
      if (error) {
        console.error(error);
        return;
      }

      ITEM_MASTER = {};

      data.forEach(row => {

        // slot_id → item_01, item_02 ... の形式へ変換
        const itemId = `item_${String(row.slot_id).padStart(2, '0')}`;

        // 商品未設定スロットは空欄として登録
        if (!row.products) {
          ITEM_MASTER[itemId] = {
            productId: null,
            name: "",
            price: 0
          };
          return;
        }

        ITEM_MASTER[itemId] = {
          productId: row.product_id,
          name: row.products.product_name,
          price: row.products.current_price
        };
      });
    }

    //利用可能なレジ一覧を取得し、レジ切替ボタンを生成する
    async function loadRegisters() {
      const { data, error } = await mySupabase
        .from('registers')
        .select('register_id, register_name')
        .order('register_id');

      if (error) {
        console.error(error);
        return;
      }

      registers = data;

      // 最初のレジを初期選択状態にする
      currentRegisterId = registers[0].register_id;
    }

    
    // ==============
    //   画面生成
    // ==============

    // 商品マスターから16個の商品カードを生成してHTMLに流し込む
    function initApp() {
      const container = document.getElementById('gridContainer');
      container.innerHTML = ""; // 初期化

      // item_01, item_02 ... の順に商品カードを生成
      Object.keys(ITEM_MASTER).forEach(itemId => {
        const itemData = ITEM_MASTER[itemId];
        const card = document.createElement('div');
        card.className = 'item-card';
        card.setAttribute('data-item-id', itemId);

        // 未設定スロット
        if (itemData.productId === null) {
          container.appendChild(card);
          return;
        }

        // 商品が設定されているカード
        card.classList.add('item-enabled');
        card.innerHTML = `
          <div class="item-click-area" onclick="plusFromCard(this)">
            <p class="item-name">${itemData.name}</p>
            <div class="item-price">${itemData.price.toLocaleString()}円</div>
          </div>
          <div class="quantity-control">
            <button class="btn-qty" onclick="minus(this)">-</button>
            <span class="qty-count">0</span>
            <button class="btn-qty" onclick="plus(this)">+</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    //レジ切替ボタンを動的生成する
    function createRegisterButtons() {
      const container = document.getElementById('registerButtons');
      container.innerHTML = "";

      registers.forEach(register => {

        const button = document.createElement('button');
        button.type = "button";
        button.className = "toggle-btn";
        button.dataset.registerId = register.register_id;
        button.textContent = register.register_name;
        button.onclick = () => {
          switchRegister(register.register_id);
        };

        // 現在選択中のレジを強調表示
        if (register.register_id === currentRegisterId) {
          button.classList.add('active');
        }

        container.appendChild(button);
      });
    }

    
    // ==================
    //   レジ切り替え
    // ==================

    //選択中のレジを切り替える
    function switchRegister(registerId) {
      currentRegisterId = registerId;
      document.querySelectorAll('#registerButtons button').forEach(button => {
        if (Number(button.dataset.registerId) === registerId) {
          button.classList.add('active');
        } else {
          button.classList.remove('active');
        }
      });
    }

    
    // ==============
    //   商品操作
    // ==============

    // 商品数量・その他入力欄を初期状態に戻す
    function resetApp() {
      const counts = document.querySelectorAll('.qty-count');
      counts.forEach(span => {
        span.textContent = '0';
        updateCountColor(span);
      });
      //その他（自由入力）もクリア
      document.getElementById('inputOtherName').value = "";
      document.getElementById('inputOtherPrice').value = "";

      updateTotal();
    }

    // マスガチャと100円割引を同時に1件ずつ追加する
    function triggerGachaLoop() {
      const cards = document.querySelectorAll('.item-card');

      cards.forEach(card => {
        const itemId = card.getAttribute('data-item-id');

        // マスガチャ本体と100円割引を同時に加算
        if (itemId === SPECIAL_ITEMS.GACHA || itemId === SPECIAL_ITEMS.DISCOUNT_100) {
          const countSpan = card.querySelector('.qty-count');
          let count = parseInt(countSpan.textContent);

          // 通常の商品個数上限（20個）を適用
          if (count < 20) {
            count++;
            countSpan.textContent = count;
            updateCountColor(countSpan);
          }
        }
      });

      updateTotal();
    }

    // 商品カード上部をクリックした際に数量を1増やす
    function plusFromCard(clickArea) {
      const quantityControl = clickArea.nextElementSibling;
      const countSpan = quantityControl.querySelector('.qty-count');
      let count = parseInt(countSpan.textContent);

      if (count < 20) {
        count++;
        countSpan.textContent = count;
        updateCountColor(countSpan);
        updateTotal();
      }
    }

    // ＋ボタン押下時の数量加算処理
    function plus(button) {
      const countSpan = button.previousElementSibling;
      let count = parseInt(countSpan.textContent);
      if (count < 20) {
        count++;
        countSpan.textContent = count;
        updateCountColor(countSpan);
        updateTotal();
      }
    }

    // ーボタン押下時の数量加算処理
    function minus(button) {
      const countSpan = button.nextElementSibling;
      let count = parseInt(countSpan.textContent);
      if (count > 0) {
        count--;
        countSpan.textContent = count;
        updateCountColor(countSpan);
        updateTotal();
      }
    }

    // 数量が1以上の商品の個数表示を赤色にする
    function updateCountColor(span) {
      const count = parseInt(span.textContent);
      if (count > 0) {
        span.classList.add('has-count');
      } else {
        span.classList.remove('has-count');
      }
    }

    // 「その他」の金額入力を-10000〜10000に制限し、合計を再計算する
    function validateOtherPrice() {
      const priceInput = document.getElementById('inputOtherPrice');
      let valStr = priceInput.value;

      if (valStr === "") {
        updateTotal();
        return;
      }

      let price = parseInt(valStr);

      // 許容範囲（-10000円～10000円）に補正
      if (price > 10000) {
        price = 10000;
        priceInput.value = 10000;
      } else if (price < -10000 || isNaN(price)) {
        price = -10000;
        priceInput.value = -10000;
      }

      updateTotal();
    }

    
    // ====================
    //   集計・金額計算
    // ====================

    //現在のカート内容を集計する（updateTotal(), openModal()で使用）
    function collectCartData() {

      const cards = document.querySelectorAll('.item-enabled');

      let a = 0; //通常商品の個数（マスガチャ除く）
      let b = 0; //マスガチャの個数
      let c = 0; //100円割引の個数
      let d = 0; //200円割引の個数
      let e = 0; //300円割引の個数

      let totalQuantityAll = 0;
      let totalQuantityNormal = 0;
      let totalQuantityDiscount = 0;

      let normalProductsSubtotal = 0;

      cards.forEach(card => {

        const itemId =
          card.getAttribute('data-item-id');

        const count =
          parseInt(
            card.querySelector('.qty-count').textContent
          );

        const itemData = ITEM_MASTER[itemId];

        totalQuantityAll += count;

        if (count <= 0) return;

        if (itemId === SPECIAL_ITEMS.GACHA) {
          b += count;
          totalQuantityNormal += count;
          normalProductsSubtotal += itemData.price * count;
        }

        else if (itemId === SPECIAL_ITEMS.DISCOUNT_100) {
          c += count;
          totalQuantityDiscount += count;
        }

        else if (itemId === SPECIAL_ITEMS.DISCOUNT_200) {
          d += count;
          totalQuantityDiscount += count;
        }

        else if (itemId === SPECIAL_ITEMS.DISCOUNT_300) {
          e += count;
          totalQuantityDiscount += count;
        }

        // 割引商品以外の通常商品
        else if (itemData.price > 0) {
          a += count;
          totalQuantityNormal += count;
          normalProductsSubtotal += itemData.price * count;
        }

      });

      return { a, b, c, d, e, totalQuantityAll, totalQuantityNormal, totalQuantityDiscount, normalProductsSubtotal };
    }

    //割引を最大限適用できるように割引券の内訳を調整する（updateTotal(), openModal()で使用）
    function optimizeDiscounts(cart) {
      let { a, b, c, d, e } = cart;

      // 200円・300円割引の枚数が通常商品数を超える場合（この場合のみ考えればよい）
      if (a < (d + e)) {
        if (e > a) {
          c = c + d + e - a;
          d = 0;
          e = a;
        } else {
          c = c + d + e - a;
          d = a - e;
        }
      }

      return { a, b, c, d, e };
    }

    // 割引ルールを考慮して合計金額を再計算する
    function updateTotal() {

      const cards = document.querySelectorAll('.item-card');

      // カート集計結果を取得
      const cart = collectCartData();
      const { a, b, c, d, e, normalProductsSubtotal } = cart;
      const totalAmountSpan = document.querySelector('.total-price-amount');

      // エラーチェック：割引枚数が適用可能数を超えていないか確認
      if ((c + d + e) > (a + b)) {
        totalAmountSpan.textContent = 'エラー';
        currentTotal = 0;
        return;
      }

      // 計算用に割引内訳を最適化
      const optimized = optimizeDiscounts(cart);
      const {
        c: optimizedC,
        d: optimizedD,
        e: optimizedE
      } = optimized;

      // 割引額を反映した商品合計を算出
      const finalDiscountTotal = (optimizedC * -100) + (optimizedD * -200) + (optimizedE * -300);
      let total = normalProductsSubtotal + finalDiscountTotal;

      //「その他」の金額があれば、それも合計金額に合算する
      const otherPriceInput = document.getElementById('inputOtherPrice').value;
      if (otherPriceInput !== "") {
        total += parseInt(otherPriceInput);
      }

      // 合計金額がマイナスになる場合はエラー
      if (total < 0) {
        totalAmountSpan.textContent = 'エラー';
        currentTotal = 0;
        return;
      }

      //「合計金額」の画面表示と内部保持値を更新
      totalAmountSpan.textContent = total.toLocaleString() + '円';
      currentTotal = total;
    }

    
    // ====================
    //   会計モーダル
    // ====================

    // 会計確認モーダルを表示する
    function openModal() {
      const cards = document.querySelectorAll('.item-enabled');

      // 現在のカート内容を取得
      const cart = collectCartData();
      let { a, b, c, d, e, totalQuantityAll, totalQuantityNormal, totalQuantityDiscount } = cart;

      // 「その他」の入力状況を取得
      const otherPriceInput = document.getElementById('inputOtherPrice').value;
      const otherPrice = otherPriceInput !== "" ? parseInt(otherPriceInput) : 0;

      // 会計前の入力チェック
      // 1. 商品が1件も選択されていない
      if (totalQuantityAll === 0 && otherPrice <= 0) {
        alert("商品が選択されていません。");
        return;
      }
      // 2. 割引枚数が適用可能数を超えている
      if (totalQuantityDiscount > totalQuantityNormal) {
        alert("マスガチャの割引ルールに違反しています。");
        return;
      }
      // 3. 合計金額がエラー状態のとき
      const totalAmountSpan = document.querySelector('.total-price-amount').textContent;
      if (totalAmountSpan === 'エラー') {
        alert("合計金額がマイナスのため、お会計に進めません。");
        return;
      }

      // 計算結果を実際の画面表示へ反映
      const optimized = optimizeDiscounts(cart);
      c = optimized.c;
      d = optimized.d;
      e = optimized.e;

      // 実際にメイン画面の表示（.qty-count）を書き換える
      cards.forEach(card => {
        const itemId = card.getAttribute('data-item-id');
        const countSpan = card.querySelector('.qty-count');

        if (itemId === SPECIAL_ITEMS.DISCOUNT_100) {
          countSpan.textContent = c;
          updateCountColor(countSpan);
        } else if (itemId === SPECIAL_ITEMS.DISCOUNT_200) {
          countSpan.textContent = d;
          updateCountColor(countSpan);
        } else if (itemId === SPECIAL_ITEMS.DISCOUNT_300) {
          countSpan.textContent = e;
          updateCountColor(countSpan);
        }
      });

      // モーダル内のレシート一覧を生成
      const receiptList = document.getElementById('modalReceiptList');
      receiptList.innerHTML = "";
      cards.forEach(card => {
        const itemId = card.getAttribute('data-item-id');
        const count = parseInt(card.querySelector('.qty-count').textContent);
        if (count > 0) {
          const itemData = ITEM_MASTER[itemId];
          const row = document.createElement('div');
          row.className = 'receipt-item';
          row.innerHTML = `
           <span>・${itemData.name} (${itemData.price.toLocaleString()}円)</span>
           <span>× ${count}</span>
         `;
          receiptList.appendChild(row);
        }
      });

      // 「その他」の商品を自由入力商品をレシートへ追加
      if (otherPrice !== 0) {
        const label = otherPrice > 0 ? "その他" : "その他（値引き）";
        const row = document.createElement('div');
        row.className = 'receipt-item';
        row.innerHTML = `
         <span>・${label}</span>
         <span>${otherPrice.toLocaleString()}円</span>
       `;
        receiptList.appendChild(row);
      }

      // モーダル内の金額表示を初期化
      document.getElementById('modalTotalAmount').textContent = currentTotal.toLocaleString() + '円';

      const depositInput = document.getElementById('inputDeposit');
      depositInput.value = "";
      depositInput.placeholder = currentTotal;

      calcChange();

      // 選択中のレジ名を表示
      const currentRegister = registers.find(r => r.register_id === currentRegisterId);
      document.getElementById('modalRegisterType').textContent = currentRegister.register_name;

      const modal = document.getElementById('checkoutModal');
      modal.style.display = 'flex';

      // モーダル表示0.05秒後にお預かり入力欄へフォーカス
      setTimeout(() => {
        depositInput.focus();
      }, 50);
    }

    // 会計確認モーダルを閉じる
    function closeModal() {
      document.getElementById('checkoutModal').style.display = 'none';
    }

    // お預かり金額入力欄で使用できないキー入力を禁止する
    function blockInvalidKeys(event) {
      if (
        event.key === '-' ||
        event.key === '.' ||
        event.key === ',' ||
        event.key === 'e' ||
        event.key === 'E'
      ) {
        event.preventDefault(); // キー入力をなかったことにする
      }
    }

    // お預かり金額からお釣りを計算し、不足時は会計確定ボタンを無効化する
    function calcChange() {
      let depositInput = document.getElementById('inputDeposit').value;
      const changeSpan = document.getElementById('modalChangeAmount');
      const confirmBtn = document.getElementById('btnConfirmPayment');

      // お預かりが未入力（空欄）のときは初期表示へ戻す
      if (depositInput === "") {
        changeSpan.textContent = "0円";
        changeSpan.classList.remove('shortage');
        confirmBtn.disabled = false;
        return;
      }

      let deposit = parseInt(depositInput);

      // お預かり金額を許容範囲（0〜150,000円）に補正
      if (deposit > 150000) {
        deposit = 150000;
        document.getElementById('inputDeposit').value = 150000;
      } else if (deposit < 0 || isNaN(deposit)) {
        deposit = 0;
        document.getElementById('inputDeposit').value = 0;
      }

      // お釣りを計算
      const change = deposit - currentTotal;

      // 不足金額を表示し、会計確定を禁止
      if (change < 0) {
        changeSpan.textContent = "不足: " + Math.abs(change).toLocaleString() + "円";
        changeSpan.classList.add('shortage');
        confirmBtn.disabled = true;
      }
      // お釣りを表示し、会計確定を許可
      else {
        changeSpan.textContent = change.toLocaleString() + "円";
        changeSpan.classList.remove('shortage');
        confirmBtn.disabled = false;
      }
    }

    
    // ================
    //   売上登録
    // ================

    // 会計を確定し、売上データをSupabaseへ保存する
    async function submitPayment() {

      // 二重送信防止のため、会計確定ボタンを一時的に無効化
      const confirmBtn = document.getElementById('btnConfirmPayment');
      confirmBtn.disabled = true;
      confirmBtn.textContent = "送信中...";

      // 「その他」の入力状況（金額と商品名）を取得
      const otherPriceInput = document.getElementById('inputOtherPrice').value;
      const otherPrice = otherPriceInput !== "" ? parseInt(otherPriceInput) : 0;
      const otherName = document.getElementById('inputOtherName').value.trim();

      try {
        // 売上ヘッダ（salesテーブル）を作成し、発行された sale_id を取得する
        const { data: saleData, error: saleError } =
          await mySupabase
            .from('sales')
            .insert([
              {
                register_id: currentRegisterId
              }
            ])
            .select()
            .single();

        if (saleError) {
          throw saleError;
        }

        // 売上明細（sale_itemsテーブル）へ登録するデータを生成
        const cards = document.querySelectorAll('.item-enabled');
        const saleItems = [];
        cards.forEach(card => {
          const itemId = card.dataset.itemId;
          const quantity = parseInt(card.querySelector('.qty-count').textContent);

          // 購入数0の商品は登録しない
          if (quantity <= 0) return;

          const item = ITEM_MASTER[itemId];

          // 未設定スロットは登録しない
          if (!item?.productId) return;

          saleItems.push({
            sale_id: saleData.sale_id,
            product_id: item.productId,
            quantity,
            unit_price: item.price,
            other_product_name: null
          });
        });

        // 「その他」が入力されている場合は明細へ追加
        if (otherPrice !== 0) {
          saleItems.push({
            sale_id: saleData.sale_id,
            product_id: 0,
            quantity: 1,
            unit_price: otherPrice,
            other_product_name: otherName || null
          });
        }

        // 売上明細を一括登録
        const { error: itemError } =
          await mySupabase
            .from('sale_items')
            .insert(saleItems);

        if (itemError) {
          throw itemError;
        }

        // 会計完了後、画面を初期状態へ戻す
        closeModal();
        resetApp();

        // 完了メッセージを表示
        const toast = document.getElementById('toastMessage');
        if (toast) {
          toast.classList.add('show');
          setTimeout(() => {
            toast.classList.remove('show');
          }, 3000);
        }

      }
      catch (err) {
        // 保存失敗時はエラー内容を出力し、利用者へ通知
        console.error(err);
        alert("売上データの保存に失敗しました。");
      }
      finally {
        // 成功・失敗にかかわらずボタン状態を元へ戻す
        confirmBtn.disabled = false;
        confirmBtn.textContent = "会計を確定";
      }
    }
  </script>

</body>

</html>
