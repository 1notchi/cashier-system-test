<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>学祭レジシステム - レジ</title>
  <link rel="stylesheet" href="stylesheet.css">
  <link rel="stylesheet" href="style_cashier.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

  <div class="header">
    <div class="header-left">
      <h1>レジ画面</h1>
      <div class="toggle-container">
        <button type="button" class="toggle-btn active" id="btn-reg-nf" onclick="switchRegister('NF')">NFレジ</button>
        <button type="button" class="toggle-btn" id="btn-reg-hokubu" onclick="switchRegister('北部祭')">北部祭レジ</button>
        <button type="button" class="toggle-btn" id="btn-reg-idou" onclick="switchRegister('移動販売')">移動販売</button>
      </div>
    </div>
    <a href="index.html" class="btn-back">← トップに戻る</a>
  </div>

  <div class="grid-container" id="gridContainer"></div>

  <div class="footer-area">
    <button class="btn-reset" onclick="resetApp()">リセット</button>
    <button class="btn-gacha-loop" onclick="triggerGachaLoop()">マスガチャループ</button>

    <div class="other-item-container">
      <span class="other-label">その他:</span>
      <input type="text" class="input-other-name" id="inputOtherName" placeholder="商品名を入力" maxlength="20">
      <input type="number" class="input-other-price" id="inputOtherPrice" oninput="validateOtherPrice()"
        placeholder="0">
      <span class="other-unit">円</span>
    </div>

    <div class="footer-bar">
      <div class="footer-right">
        <div class="total-price-container">
          <span class="total-price-label">合計金額</span>
          <span class="total-price-amount">0円</span>
        </div>
        <button class="btn-checkout" onclick="openModal()">会計</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-window">
      <p class="modal-title">💰 会計確認</p>

      <div class="modal-calc-row" style="color: #4a5568; font-size: 16px; margin-bottom: -5px;">
        <span>担当レジ</span>
        <span id="modalRegisterType" style="color: #333333; font-weight: bold;">--レジ</span>
      </div>

      <div class="modal-receipt-area" id="modalReceiptList"></div>

      <div class="modal-calc-row">
        <span>合計金額</span>
        <span id="modalTotalAmount">0円</span>
      </div>

      <div class="modal-calc-row">
        <span>お預かり</span>
        <div>
          <input type="number" class="input-money" id="inputDeposit" oninput="calcChange()"
            onkeydown="blockInvalidKeys(event)" placeholder="0"> 円
        </div>
      </div>

      <div class="modal-calc-row" style="border-top: 2px dashed #e2e8f0; padding-top: 15px;">
        <span>お釣り</span>
        <span class="change-amount" id="modalChangeAmount">0円</span>
      </div>

      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeModal()">戻る</button>
        <button class="btn-modal-confirm" id="btnConfirmPayment" onclick="submitPayment()">会計を確定</button>
      </div>
    </div>
  </div>

  <div id="toastMessage" class="toast-message">お会計が完了しました！</div>

  <script>
    // ==========================================
    // 💡 1. 状態管理変数の一元化（二重宣言の解消）
    // ==========================================
    const supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

    let itemMaster = Array(16).fill(null); // 1〜16のスロットを保持する配列
    let registerMaster = [];              // レジ名とIDのペアを保持

    let currentRegister = "NF";           // 現在選択中のレジ名
    let cart = {};                        // カートの中身 { product_id: 数量 }
    let orderHistory = [];
    let currentTotal = 0;

    // 初期化イベントの一元管理
    window.addEventListener('DOMContentLoaded', () => {
      initApp();
    });

    // ==========================================
    // 💡 2. アプリ初期化：Supabaseからマスターを取得
    // ==========================================
    async function initApp() {
        try {
            // レジマスタの取得
            const { data: regData, error: regError } = await supabase.from('registers').select('*');
            if (regError) throw regError;
            registerMaster = regData;

            // 表示スロットと商品のデータを結合して取得
            const { data: slotData, error: slotError } = await supabase
                .from('display_slots')
                .select(`
                    slot_id,
                    products ( product_id, product_name, current_price )
                `)
                .order('slot_id', { ascending: true });

            if (slotError) throw slotError;

            // 1〜16マスの配列に再配置
            itemMaster = Array(16).fill(null);
            slotData.forEach(slot => {
                if (slot.products) {
                    itemMaster[slot.slot_id - 1] = {
                        id: slot.products.product_id,
                        product_id: slot.products.product_id,
                        name: slot.products.product_name,
                        price: slot.products.current_price
                    };
                }
            });

            // ⚠️ 既存コードにある「renderGrid()」が別ファイル等で定義されている場合は実行
            if (typeof renderGrid === 'function') renderGrid();
            
            updateTotal();
        } catch (err) {
            console.error("初期データの取得に失敗しました:", err);
            alert("データの読み込みに失敗しました。ページを再読み込みしてください。");
        }
    }

    // ==========================================
    // 💡 3. カート状態の同期と計算ロジック
    // ==========================================
    
    // 画面の数字からカート変数(cart)を一括更新する関数
    function syncCartFromDOM() {
      cart = {};
      const cards = document.querySelectorAll('.item-card');
      cards.forEach(card => {
        // もしHTML側が slot_id (1-16) 等で data-item-id を持っている場合を考慮
        const itemId = card.getAttribute('data-item-id'); 
        const count = parseInt(card.querySelector('.qty-count').textContent) || 0;
        
        // item_1 から数字だけを抽出するか、スロットインデックスから商品IDを特定
        let index = -1;
        if (itemId && itemId.startsWith('item_')) {
          index = parseInt(itemId.replace('item_', '')) - 1;
        } else {
          index = parseInt(itemId) - 1;
        }

        const product = itemMaster[index];
        if (product && count > 0) {
          cart[product.product_id] = count;
        }
      });
    }

    // 合計金額をその場で計算して返す関数（submitPaymentのエラー対策）
    function calculateTotal() {
      return currentTotal;
    }

    // 合計金額の計算（修正版）
    function updateTotal() {
      const cards = document.querySelectorAll('.item-card');

      let a = 0; // マスガチャ以外の通常商品数
      let b = 0; // マスガチャの購入数
      let c = 0; // 100円割引の枚数
      let d = 0; // 200円割引の枚数
      let e = 0; // 300円割引の枚数

      let normalProductsSubtotal = 0;

      cards.forEach(card => {
        const itemId = card.getAttribute('data-item-id');
        const count = parseInt(card.querySelector('.qty-count').textContent) || 0;
        
        let index = -1;
        if (itemId && itemId.startsWith('item_')) {
          index = parseInt(itemId.replace('item_', '')) - 1;
        } else {
          index = parseInt(itemId) - 1;
        }
        
        const itemData = itemMaster[index];
        if (!itemData || count <= 0) return;

        // 商品名で割引やガチャを判定
        if (itemData.name === "マスガチャ") {
          b += count;
          normalProductsSubtotal += itemData.price * count;
        } else if (itemData.name.includes("100円割引") || itemData.name.includes("-100円")) {
          c += count;
        } else if (itemData.name.includes("200円割引") || itemData.name.includes("-200円")) {
          d += count;
        } else if (itemData.name.includes("300円割引") || itemData.name.includes("-300円")) {
          e += count;
        } else if (itemData.price > 0) {
          a += count;
          normalProductsSubtotal += itemData.price * count;
        }
      });

      const totalAmountSpan = document.querySelector('.total-price-amount');

      if ((c + d + e) > (a + b)) {
        if (totalAmountSpan) totalAmountSpan.textContent = 'エラー';
        currentTotal = 0;
        return;
      }

      if (a < (d + e)) {
        if (e > a) {
          c = c + d + e - a;
          d = 0;
          e = a;
        } else {
          c = c + d + e - a;
          d = a - e;
        }
      }

      const finalDiscountTotal = (c * -100) + (d * -200) + (e * -300);
      let total = normalProductsSubtotal + finalDiscountTotal;

      const otherPriceInput = document.getElementById('inputOtherPrice').value;
      if (otherPriceInput !== "") {
        total += parseInt(otherPriceInput);
      }

      if (total < 0) {
        if (totalAmountSpan) totalAmountSpan.textContent = 'エラー';
        currentTotal = 0;
        return;
      }

      if (totalAmountSpan) totalAmountSpan.textContent = total.toLocaleString() + '円';
      currentTotal = total;

      // 金額変更のタイミングで最新のDOM状態をカート変数に同期
      syncCartFromDOM();
    }

    // ==========================================
    // 💡 4. ボタン操作イベント
    // ==========================================
    function resetApp() {
      const counts = document.querySelectorAll('.qty-count');
      counts.forEach(span => {
        span.textContent = '0';
        updateCountColor(span);
      });
      document.getElementById('inputOtherName').value = "";
      document.getElementById('inputOtherPrice').value = "";
      updateTotal();
    }

    function triggerGachaLoop() {
      const cards = document.querySelectorAll('.item-card');
      cards.forEach(card => {
        const itemId = card.getAttribute('data-item-id');
        // HTML側が 'item_13' のような文字列で管理している場合
        if (itemId === "item_13" || itemId === "item_14") {
          const countSpan = card.querySelector('.qty-count');
          let count = parseInt(countSpan.textContent) || 0;
          if (count < 20) {
            count++;
            countSpan.textContent = count;
            updateCountColor(countSpan);
          }
        }
      });
      updateTotal();
    }

    function plusFromCard(clickArea) {
      const quantityControl = clickArea.nextElementSibling;
      const countSpan = quantityControl.querySelector('.qty-count');
      let count = parseInt(countSpan.textContent) || 0;
      if (count < 20) {
        count++;
        countSpan.textContent = count;
        updateCountColor(countSpan);
        updateTotal();
      }
    }

    function plus(button) {
      const countSpan = button.previousElementSibling;
      let count = parseInt(countSpan.textContent) || 0;
      if (count < 20) {
        count++;
        countSpan.textContent = count;
        updateCountColor(countSpan);
        updateTotal();
      }
    }

    function minus(button) {
      const countSpan = button.nextElementSibling;
      let count = parseInt(countSpan.textContent) || 0;
      if (count > 0) {
        count--;
        countSpan.textContent = count;
        updateCountColor(countSpan);
        updateTotal();
      }
    }

    function updateCountColor(span) {
      const count = parseInt(span.textContent) || 0;
      if (count > 0) {
        span.classList.add('has-count');
      } else {
        span.classList.remove('has-count');
      }
    }

    function validateOtherPrice() {
      const priceInput = document.getElementById('inputOtherPrice');
      let valStr = priceInput.value;
      if (valStr === "") {
        updateTotal();
        return;
      }
      let price = parseInt(valStr);
      if (price > 10000) {
        price = 10000;
        priceInput.value = 10000;
      } else if (price < -10000 || isNaN(price)) {
        price = -10000;
        priceInput.value = -10000;
      }
      updateTotal();
    }

    // ==========================================
    // 💡 5. モーダル制御 & 会計確定（Supabase送信）
    // ==========================================
    function openModal() {
      syncCartFromDOM(); // モーダルを開く直前に確実にカートを同期
      const cards = document.querySelectorAll('.item-card');

      let totalQuantityAll = 0;
      let totalQuantityDiscount = 0;
      let totalQuantityNormal = 0;

      let a = 0; let b = 0; let c = 0; let d = 0; let e = 0;

      cards.forEach(card => {
        const itemId = card.getAttribute('data-item-id');
        const count = parseInt(card.querySelector('.qty-count').textContent) || 0;
        totalQuantityAll += count;

        let index = -1;
        if (itemId && itemId.startsWith('item_')) {
          index = parseInt(itemId.replace('item_', '')) - 1;
        } else {
          index = parseInt(itemId) - 1;
        }
        const itemData = itemMaster[index];
        if (!itemData) return;

        if (itemData.name.includes("割引")) {
          totalQuantityDiscount += count;
          if (itemData.name.includes("100円")) c += count;
          if (itemData.name.includes("200円")) d += count;
          if (itemData.name.includes("300円")) e += count;
        } else {
          totalQuantityNormal += count;
          if (itemData.name === "マスガチャ") b += count;
          else if (itemData.price > 0) a += count;
        }
      });

      const otherPriceInput = document.getElementById('inputOtherPrice').value;
      const otherPrice = otherPriceInput !== "" ? parseInt(otherPriceInput) : 0;

      if (totalQuantityAll === 0 && otherPrice <= 0) {
        alert("商品が選択されていません。");
        return;
      }

      if (totalQuantityDiscount > totalQuantityNormal) {
        alert("マスガチャの割引ルールに違反しています。");
        return;
      }

      const totalAmountSpan = document.querySelector('.total-price-amount').textContent;
      if (totalAmountSpan === 'エラー') {
        alert("合計金額がマイナスのため、お会計に進めません。");
        return;
      }

      const receiptList = document.getElementById('modalReceiptList');
      receiptList.innerHTML = "";

      // レシート明細の生成
      cards.forEach(card => {
        const itemId = card.getAttribute('data-item-id');
        const count = parseInt(card.querySelector('.qty-count').textContent) || 0;

        if (count > 0) {
          let index = -1;
          if (itemId && itemId.startsWith('item_')) {
            index = parseInt(itemId.replace('item_', '')) - 1;
          } else {
            index = parseInt(itemId) - 1;
          }
          const itemData = itemMaster[index];
          if(itemData) {
            const row = document.createElement('div');
            row.className = 'receipt-item';
            row.innerHTML = `
              <span>・${itemData.name} (${itemData.price.toLocaleString()}円)</span>
              <span>× ${count}</span>
            `;
            receiptList.appendChild(row);
          }
        }
      });

      if (otherPrice !== 0) {
        const label = otherPrice > 0 ? "その他" : "その他（値引き）";
        const row = document.createElement('div');
        row.className = 'receipt-item';
        row.innerHTML = `
          <span>・${label}</span>
          <span>${otherPrice.toLocaleString()}円</span>
        `;
        receiptList.appendChild(row);
      }

      document.getElementById('modalTotalAmount').textContent = currentTotal.toLocaleString() + '円';
      const depositInput = document.getElementById('inputDeposit');
      depositInput.value = "";
      depositInput.placeholder = currentTotal;

      calcChange();

      document.getElementById('modalRegisterType').textContent = currentRegister + "レジ";
      document.getElementById('checkoutModal').style.display = 'flex';

      setTimeout(() => { depositInput.focus(); }, 50);
    }

    function closeModal() {
      document.getElementById('checkoutModal').style.display = 'none';
    }

    function blockInvalidKeys(event) {
      if (['-', '.', ',', 'e', 'E'].includes(event.key)) {
        event.preventDefault();
      }
    }

    function calcChange() {
      let depositInput = document.getElementById('inputDeposit').value;
      const changeSpan = document.getElementById('modalChangeAmount');
      const confirmBtn = document.getElementById('btnConfirmPayment');

      if (depositInput === "") {
        changeSpan.textContent = "0円";
        changeSpan.classList.remove('shortage');
        confirmBtn.disabled = false;
        return;
      }

      let deposit = parseInt(depositInput);
      if (deposit > 150000) {
        deposit = 150000;
        document.getElementById('inputDeposit').value = 150000;
      } else if (deposit < 0 || isNaN(deposit)) {
        deposit = 0;
        document.getElementById('inputDeposit').value = 0;
      }

      const change = deposit - currentTotal;
      if (change < 0) {
        changeSpan.textContent = "不足: " + Math.abs(change).toLocaleString() + "円";
        changeSpan.classList.add('shortage');
        confirmBtn.disabled = true;
      } else {
        changeSpan.textContent = change.toLocaleString() + "円";
        changeSpan.classList.remove('shortage');
        confirmBtn.disabled = false;
      }
    }

    // 💡 売上確定とSupabase送信（完全版）
    async function submitPayment() {
        const total = calculateTotal();
        if (total === 0 && Object.keys(cart).length === 0) {
            alert('カートが空です');
            return;
        }

        const currentRegInfo = registerMaster.find(r => r.register_name === currentRegister);
        if (!currentRegInfo) {
            alert(`レジ「${currentRegister}」がマスターに登録されていません。`);
            return;
        }

        try {
            // 1. 会計親テーブル(sales)に挿入
            const { data: saleResult, error: saleError } = await supabase
                .from('sales')
                .insert([{ register_id: currentRegInfo.register_id }])
                .select()
                .single();

            if (saleError) throw saleError;
            const newSaleId = saleResult.sale_id;

            // 2. 会計明細テーブル(sale_items)用のデータ配列を作成
            const saleItemsData = Object.keys(cart).map(productId => {
                const item = itemMaster.find(i => i && i.product_id == productId);
                return {
                    sale_id: newSaleId,
                    product_id: Number(productId),
                    quantity: cart[productId],
                    unit_price: item ? item.price : 0,
                    other_product_name: item ? item.name : '不明な商品'
                };
            });

            // 「その他」自由入力枠に金額がある場合、ダミー商品（またはその他レコード）として明細追加
            const otherName = document.getElementById('inputOtherName').value || 'その他';
            const otherPriceInput = document.getElementById('inputOtherPrice').value;
            if (otherPriceInput !== "") {
                // 💡 注意: product_idマスタに「その他(自由入力枠用)」のID（例: 999など）があればそれを、
                // なければ一先ず1番などを借りるか、DB設計に合わせてproduct_idを指定してください。
                saleItemsData.push({
                    sale_id: newSaleId,
                    product_id: 1, // 暫定。実態に合わせて変更してください
                    quantity: 1,
                    unit_price: parseInt(otherPriceInput),
                    other_product_name: otherName
                });
            }

            // 3. 明細を一括インサート
            if (saleItemsData.length > 0) {
                const { error: itemsError } = await supabase
                    .from('sale_items')
                    .insert(saleItemsData);
                if (itemsError) throw itemsError;
            }

            // 成功後のクリーンアップ処理
            cart = {};
            closeModal();
            resetApp();

            // トースト表示
            const toast = document.getElementById('toastMessage');
            if (toast) {
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 3000);
            }

        } catch (err) {
            console.error("売上データの保存に失敗しました:", err);
            alert('データベースへの保存に失敗しました。通信環境やテーブル設定を確認してください。');
        }
    }

    function switchRegister(mode) {
      if (currentRegister === mode) return;
      currentRegister = mode;

      const btnNf = document.getElementById('btn-reg-nf');
      const btnHokubu = document.getElementById('btn-reg-hokubu');
      const btnIdou = document.getElementById('btn-reg-idou');

      if(btnNf) btnNf.classList.remove('active');
      if(btnHokubu) btnHokubu.classList.remove('active');
      if(btnIdou) btnIdou.classList.remove('active');

      if (mode === 'NF' && btnNf) btnNf.classList.add('active');
      else if (mode === '北部祭' && btnHokubu) btnHokubu.classList.add('active');
      else if (mode === '移動販売' && btnIdou) btnIdou.classList.add('active');

      console.log("現在のレジモード:", currentRegister);
    }
  </script>

</body>

</html>
