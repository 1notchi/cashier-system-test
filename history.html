<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>NFレジシステム_会計履歴</title>
  <link rel="stylesheet" href="stylesheet.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="history.css">
  <link rel="stylesheet" href="toast.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

  <!-- 共通ヘッダー挿入領域 -->
  <div id="header-container"></div>

  <main class="page-content">

    <div class="history-container">
      <div id="historyTableWrapper" class="table-wrapper">
        <table class="history-table">
          <thead>
            <tr id="historyTableHeaderRow">
              <th>No.</th>
              <th>レジ</th>
              <th>ユーザー</th>
              <th>会計時刻</th>
              <!-- 商品列・操作列はJSで追加 -->
            </tr>
          </thead>
          <tbody id="historyTableBody">
          </tbody>
        </table>
      </div>

      <div id="emptyHistoryMessage" class="empty-history-message">
        会計履歴が存在しません
      </div>
    </div>
  </main>

  <!-- 会計情報編集モーダル -->
  <div id="editModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <div class="modal edit-modal">
      <h2 id="editModalTitle" class="edit-modal-title">
        会計情報編集
      </h2>

      <div id="editProductList" class="edit-product-list">
      </div>

      <div class="modal-buttons edit-modal-buttons">
        <button id="saveEditButton" type="button" class="save-button">
          保存
        </button>

        <button id="cancelEditButton" type="button">
          キャンセル
        </button>
      </div>
    </div>
  </div>

  <!-- 削除確認モーダル -->
  <div id="deleteModal" class="modal-overlay">
    <div class="modal">
      <p>本当に削除していいですか？</p>

      <div class="modal-buttons">
        <button id="confirmDeleteButton" class="delete-button">
          削除
        </button>

        <button id="cancelDeleteButton">
          キャンセル
        </button>
      </div>
    </div>
  </div>

  <!-- 復活確認モーダル -->
  <div id="restoreModal" class="modal-overlay">
    <div class="modal">
      <p>本当に復活していいですか？</p>

      <div class="modal-buttons">
        <button id="confirmRestoreButton" type="button" class="restore-button">
          復活
        </button>

        <button id="cancelRestoreButton" type="button">
          キャンセル
        </button>
      </div>
    </div>
  </div>

  <!-- mySupabase生成, ログイン認証 -->
  <script src="auth.js"></script>
  <!-- 共通ヘッダー -->
  <script src="header.js"></script>
  <!-- 共通トースト -->
  <script src="toast.js"></script>

  <!-- history.html専用処理 -->
  <script src="history.js"></script>

</body>

</html>
