<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFレジシステム_ログイン</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f7f6;
      font-family: sans-serif;
    }

    .login-box {
      width: 380px;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo h1 {
      margin: 0;
      font-size: 28px;
      color: #333;
    }

    .login-logo p {
      margin-top: 8px;
      color: #666;
      font-size: 15px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #555;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 15px;
      transition: .2s;
    }

    input:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49,130,206,.15);
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #3182ce;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      background: #2b6cb0;
    }

    .error {
      margin-top: 18px;
      color: #dc3545;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="login-box">

  <div class="login-title">
    <h1>NFレジ</h1>
    <p>ログインしてください</p>
  </div>

  <div class="input-group">
    <label for="email">メールアドレス</label>
    <input
      id="email"
      type="email"
      placeholder="example@example.com">
  </div>

  <div class="input-group">
    <label for="password">パスワード</label>
    <input
      id="password"
      type="password"
      placeholder="パスワード">
  </div>

  <button onclick="login()">
    ログイン
  </button>

  <div id="error" class="error"></div>

</div>

  <script>
    const mySupabase = window.supabase.createClient(
      CONFIG.SUPABASE_URL,
      CONFIG.SUPABASE_KEY
    );

    window.onload = async () => {
      const {data: { session }} = await mySupabase.auth.getSession();
      if (session) {
        location.href = "top.html";
      }
    };

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { error } =
        await mySupabase.auth.signInWithPassword({
          email,
          password
        });
      if (error) {
        document.getElementById('error').textContent =
          'ログインに失敗しました';
        return;
      }

      location.href = 'top.html';
    }
  </script>

</body>
</html>
