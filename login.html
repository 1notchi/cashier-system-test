<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFレジシステム_ログイン</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="toast.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

  <div class="login-box">

    <div class="login-title">
      <h1>NFレジ</h1>
      <p>ログインしてください</p>
    </div>

    <div class="input-group">
      <label for="email">メールアドレス</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="example@example.com" required
        maxlength="254" aria-describedby="login-error">
    </div>

    <div class="input-group">
      <label for="password">パスワード</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="パスワード"
        aria-describedby="login-error">

      <div id="login-error" class="login-input-error" role="alert"></div>
    </div>

    <button onclick="login()">
      ログイン
    </button>

    <button type="button" id="forgot-password" onclick="location.href='reset.html'">
      パスワードを忘れた場合
    </button>

  </div>

  <!-- 共通トースト -->
  <script src="toast.js"></script>
  <!-- login.html専用処理 -->
  <script src="login.js"></script>

</body>

</html>
