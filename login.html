<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学祭レジシステム - ログイン</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    body {
      font-family: sans-serif;
      background: #f7fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,.1);
      width: 320px;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 12px;
      cursor: pointer;
    }

    .error {
      color: red;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>学祭レジ</h1>

    <input
      id="email"
      type="email"
      placeholder="メールアドレス">

    <input
      id="password"
      type="password"
      placeholder="パスワード">

    <button onclick="login()">
      ログイン
    </button>

    <div id="error" class="error"></div>
  </div>

  <script>
    const mySupabase = window.supabase.createClient(
      CONFIG.SUPABASE_URL,
      CONFIG.SUPABASE_KEY
    );

    window.onload = async () => {
      const {
        data: { session }
      } = await mySupabase.auth.getSession();

      if (session) {
        location.href = "cashier.html";
      }
    };

    async function login() {

      const email =
        document.getElementById('email').value;

      const password =
        document.getElementById('password').value;

      const { error } =
        await mySupabase.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        document.getElementById('error').textContent =
          'ログインに失敗しました';
        return;
      }

      location.href = 'top.html';
    }
  </script>

</body>
</html>
