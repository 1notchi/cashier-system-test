<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>NFレジシステム_売上確認画面</title>
  <link rel="stylesheet" href="stylesheet.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="sales.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

  <!-- 共通ヘッダー挿入領域 -->
  <div id="header-container"></div>

  <main class="page-content">

    <div class="sales-container">

      <section class="control-panel">
        <div class="segment-container">
          <button class="segment-btn active" onclick="switchRegister('all', this)">すべてのレジ</button>
          <button class="segment-btn" onclick="switchRegister('NF', this)">NFレジ</button>
          <button class="segment-btn" onclick="switchRegister('北部祭', this)">北部祭レジ</button>
          <button class="segment-btn" onclick="switchRegister('移動販売', this)">移動販売</button>
        </div>

        <div class="sync-container">
          <span class="last-update-time" id="txtLastUpdate">最終更新: --:--:--</span>
          <button class="btn-sync" onclick="fetchSalesData()">
            <span>🔄</span> データを最新に更新
          </button>
        </div>
      </section>

      <section class="matrix-panel">
        <div class="matrix-header">
          <div class="mode-container">
            <button class="mode-btn active" id="btnModeQty" onclick="switchDisplayMode('qty')">個数モード</button>
            <button class="mode-btn" id="btnModeAmount" onclick="switchDisplayMode('amount')">金額モード</button>
          </div>
        </div>

        <div class="table-wrapper">
          <table class="sales-matrix-table">
            <thead id="matrixTableHead">
            </thead>
            <tbody id="matrixTableBody">
            </tbody>
          </table>
        </div>
      </section>

      <section class="summary-board-container">

        <div class="summary-card">
          <div class="card-title">📅 今日のサマリー <span style="font-size: 14px; font-weight: normal; color: #718096;"
              id="txtTodayLabel">(--/--)
            </span></div>
          <div class="card-row">
            <span class="card-label">会計回数</span>
            <div class="card-value" id="lblTodayCount">0<span>回</span></div>
          </div>
          <div class="card-row">
            <span class="card-label">今日の売上金額</span>
            <div class="card-value" style="color: #3182ce;" id="lblTodayAmount">0<span>円</span></div>
          </div>
        </div>

        <div class="summary-card total-scope">
          <div class="card-title">🏆 期間中の総サマリー <span
              style="font-size: 14px; font-weight: normal; color: #718096;">(学祭期間通算)</span></div>
          <div class="card-row">
            <span class="card-label">総会計回数</span>
            <div class="card-value" id="lblTotalCount">0<span>回</span></div>
          </div>
          <div class="card-row">
            <span class="card-label">総売上金額</span>
            <div class="card-value" style="color: #38a169;" id="lblTotalAmount">0<span>円</span></div>
          </div>
        </div>

      </section>

    </div>

  </main>

  <!-- mySupabase生成, ログイン認証 -->
  <script src="auth.js"></script>
  <!-- 共通ヘッダー -->
  <script src="header.js"></script>

  <!-- sales.html専用処理 -->
  <script src="sales.js"></script>

</body>

</html>
