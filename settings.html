<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>NFレジシステム_設定画面</title>
  <link rel="stylesheet" href="stylesheet.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="toast.css">
  <link rel="stylesheet" href="settings.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>
  <!-- 共通ヘッダー挿入領域 -->
  <div id="header-container"></div>

  <main class="page-content">

    <h1>設定</h1>

    <!-- タイトル -->
    <h2 class="settings-section-title">学園祭設定</h2>

    <!-- カード -->
    <section class="settings-card">
      <div class="setting-row">
        <div class="setting-label">現在の学園祭</div>

        <div class="setting-value">
          <span id="currentFestivalName">読み込み中...</span>
        </div>

        <button class="setting-button" onclick="changeFestival()">
          変更
        </button>
      </div>

      <div class="setting-row">
        <div class="setting-label">名称変更</div>

        <div class="setting-value"></div>

        <button type="button" class="setting-button" onclick="changeFestivalName()">
          編集
        </button>
      </div>

      <div class="setting-row">
        <div class="setting-label">日程</div>

        <div class="setting-value">
          <span id="festivalDates">読み込み中...</span>
        </div>

        <button class="setting-button" onclick="editFestivalDates()">
          編集
        </button>
      </div>
    </section>

  </main>

  <!-- 学園祭変更モーダル -->
  <div id="festivalModal" class="modal-overlay" style="display:none;">
    <div class="modal festival-modal">

      <h2>現在の学園祭を変更</h2>

      <p class="modal-warning">
        ⚠ この設定を変更すると、全てのユーザーの表示が切り替わります。
      </p>

      <div class="festival-row">
        <div class="festival-label">現在</div>
        <div id="currentFestivalText"></div>
      </div>

      <div class="festival-row">
        <div class="festival-label">切り替え先</div>

        <select id="festivalSelect" class="setting-select">
        </select>
      </div>

      <div class="modal-buttons">
        <button class="setting-button" onclick="confirmFestivalChange()">
          切り替える
        </button>

        <button class="cancel-button" onclick="closeFestivalModal()">
          キャンセル
        </button>
      </div>

      <hr>

      <button class="add-festival-button" onclick="openAddFestivalModal()">
        ＋ 新しい学園祭を追加
      </button>

      <p class="modal-note">
        ※ 作成した学園祭は削除できません。
      </p>

    </div>
  </div>

  <!-- 学園祭追加モーダル -->
  <div id="addFestivalModal" class="modal-overlay" style="display:none;">
    <div class="modal festival-form-modal">

      <h2>学園祭追加</h2>

      <div class="festival-row festival-id-row">
        <label for="addFestivalIdInput" class="festival-label">学園祭ID：</label>
        <div class="festival-input-area">
          <input type="text" id="addFestivalIdInput" class="festival-form-input" inputmode="numeric" maxlength="6"
            aria-describedby="addFestivalIdError" oninput="handleAddFestivalIdInput(this)">
          <div id="addFestivalIdError" class="festival-input-error" aria-live="polite"></div>
        </div>
      </div>

      <div class="festival-row festival-name-row">
        <label for="addFestivalNameInput" class="festival-label">学園祭の名称を入力：</label>
        <div class="festival-input-area">
          <input type="text" id="addFestivalNameInput" class="festival-form-input" maxlength="20"
            aria-describedby="addFestivalNameError" oninput="clearAddFestivalNameError()">
          <div id="addFestivalNameError" class="festival-input-error" aria-live="polite"></div>
        </div>
      </div>

      <div class="modal-buttons">
        <button type="button" class="setting-button" onclick="confirmAddFestival()">
          保存
        </button>

        <button type="button" class="cancel-button" onclick="closeAddFestivalModal()">
          キャンセル
        </button>
      </div>

    </div>
  </div>

  <!-- 名称変更モーダル -->
  <div id="nameEditModal" class="modal-overlay" style="display:none;">
    <div class="modal festival-form-modal">

      <h2>名称変更</h2>

      <div class="festival-row">
        <label for="nameFestivalSelect" class="festival-label">現在の名称</label>

        <select id="nameFestivalSelect" class="setting-select" onchange="loadFestivalNameForEdit()">
        </select>
      </div>

      <div class="festival-row">
        <label for="festivalIdInput" class="festival-label">学園祭ID</label>
        <input type="text" id="festivalIdInput" class="festival-form-input" disabled>
      </div>

      <div class="festival-row">
        <label for="festivalNameInput" class="festival-label">新しい名称を入力：</label>
        <input type="text" id="festivalNameInput" class="festival-form-input" maxlength="20">
      </div>

      <div class="modal-buttons">
        <button type="button" class="setting-button" onclick="confirmFestivalNameEdit()">
          保存
        </button>

        <button type="button" class="cancel-button" onclick="closeNameEditModal()">
          キャンセル
        </button>
      </div>

    </div>
  </div>

  <!-- 日程編集モーダル -->
  <div id="dateEditModal" class="modal-overlay" style="display:none;">
    <div class="modal date-edit-modal">

      <h2>日程を編集</h2>

      <div class="festival-row">
        <div class="festival-label">学園祭</div>

        <select id="dateFestivalSelect" class="setting-select" onchange="loadFestivalDatesForEdit()">
        </select>
      </div>

      <div id="dateInputContainer">
        <!-- JavaScriptで日付入力欄を生成 -->
      </div>

      <button id="addDateButton" class="add-festival-button" onclick="addDateInput()">
        ＋ 日程を追加
      </button>

      <p class="modal-note">
        ※ 日程は1〜7日まで登録できます。
      </p>

      <div class="modal-buttons">

        <button class="setting-button" onclick="confirmDateEdit()">
          保存
        </button>

        <button class="cancel-button" onclick="closeDateEditModal()">
          キャンセル
        </button>

      </div>

    </div>
  </div>

  <!-- mySupabase生成, ログイン認証 -->
  <script src="auth.js"></script>
  <!-- 共通ヘッダー -->
  <script src="header.js"></script>
  <!-- 共通トースト -->
  <script src="toast.js"></script>


  <!-- setting.html専用処理 -->
  <script src="settings.js"></script>

</body>

</html>
