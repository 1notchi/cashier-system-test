<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>学祭レジシステム - トップ</title>
  <link rel="stylesheet" href="style_top.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

  <h1>学祭レジシステム</h1>
  <p>メニューを選択してください</p>

  <div class="button-container">
    <a href="cashier.html" class="btn btn-cashier">レジ画面へ</a>
    <a href="sales.html" class="btn btn-sales">売上確認へ</a>
  </div>

  <div class="logout-container">
    <button
      class="btn btn-logout"
      onclick="logout()">
      ログアウト
    </button>
  </div>

  <script>
    // Supabaseクライアント生成
    const mySupabase = window.supabase.createClient(
      CONFIG.SUPABASE_URL,
      CONFIG.SUPABASE_KEY
    );
    
    window.onload = async () => {
      //ログインしていなかったらログイン画面に戻す
      const {
        data: { session }
      } = await mySupabase.auth.getSession();
      if (!session) {
        location.href = "login.html";
        return;
      }
    };

    async function logout() {
      await mySupabase.auth.signOut();
      location.href = "login.html";
    }
  </script>

</body>

</html>
