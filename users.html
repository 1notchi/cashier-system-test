<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>NFレジシステム_ユーザー管理</title>

  <link rel="stylesheet" href="stylesheet.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="toast.css">
  <link rel="stylesheet" href="users.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>
  <!-- 共通ヘッダー -->
  <div id="header-container"></div>

  <main class="page-content">
    <p id="users-status" role="status">
      ユーザー情報を確認しています...
    </p>

    <div id="users-content" hidden>
      <h1>ユーザー管理</h1>

      <div class="users-container">
        <div id="usersTableWrapper" class="users-table-wrapper">
          <table class="users-table" aria-label="ユーザー一覧">
            <thead>
              <tr>
                <th scope="col">No.</th>
                <th scope="col">作サーID</th>
                <th scope="col">名前</th>
                <th scope="col">メールアドレス</th>
                <th scope="col">ロール</th>
                <th scope="col">ステータス</th>
                <th scope="col">最終ログイン</th>
                <th scope="col">操作</th>
              </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>

        <div id="emptyUsersMessage" class="empty-users-message" hidden>
          ユーザーが存在しません
        </div>
      </div>
    </div>
  </main>

  <!-- 認証モーダル -->
  <dialog id="verifyUserModal" class="users-verify-modal" aria-labelledby="verifyUserTitle"
    aria-describedby="verifyUserMessage">
    <button id="closeVerifyUserButton" type="button" class="users-modal-close" aria-label="閉じる">×</button>

    <h2 id="verifyUserTitle" class="users-verify-title">
      認証確認
    </h2>

    <div id="verifyUserMessage" class="users-verify-message">
      <div id="verifyUserName"></div>
      <div id="verifyUserEmail"></div>
      <p>を認証しますか？</p>
    </div>

    <div class="users-modal-buttons">
      <button id="verifyAsStaffButton" type="button" class="users-action-button users-verify-button">はい（スタッフ）</button>

      <button id="verifyAsViewerButton" type="button" class="users-action-button users-verify-button">はい（閲覧専用）</button>

      <button id="rejectVerifyUserButton" type="button" class="users-action-button users-reset-button">いいえ</button>

      <button id="cancelVerifyUserButton" type="button" class="users-action-button users-modal-cancel"
        autofocus>キャンセル</button>
    </div>
  </dialog>

  <!-- mySupabase生成, ログイン認証 -->
  <script src="auth.js"></script>
  <!-- 共通ヘッダー -->
  <script src="header.js"></script>
  <!-- 共通トースト -->
  <script src="toast.js"></script>


  <!-- users.html専用処理 -->
  <script src="users.js"></script>
</body>

</html>
