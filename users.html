<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>NFレジシステム_ユーザー管理</title>

  <link rel="stylesheet" href="stylesheet.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="toast.css">
  <link rel="stylesheet" href="users.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>
  <!-- 共通ヘッダー -->
  <div id="header-container"></div>

  <!-- ユーザー一覧表 -->
  <main class="page-content">
    <p id="users-status" role="status">
      ユーザー情報を確認しています...
    </p>

    <div id="users-content" hidden>
      <div class="users-container">

        <div class="users-toolbar">
          <h1>ユーザー管理</h1>

          <button id="addAccountButton" type="button" class="users-action-button users-add-button">
            アカウントを追加
          </button>
        </div>

        <div id="usersTableWrapper" class="users-table-wrapper">
          <table class="users-table" aria-label="ユーザー一覧">
            <thead>
              <tr>
                <th scope="col">No.</th>
                <th scope="col">作サーID</th>
                <th scope="col">名前</th>
                <th scope="col">メールアドレス</th>
                <th scope="col">ロール</th>
                <th scope="col">ステータス</th>
                <th scope="col">最終ログイン</th>
                <th scope="col">操作</th>
              </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>

        <div id="emptyUsersMessage" class="empty-users-message" hidden>
          ユーザーが存在しません
        </div>
      </div>
    </div>
  </main>

  <!-- アカウント追加モーダル -->
  <dialog id="addAccountModal" class="users-verify-modal" aria-labelledby="addAccountTitle">

    <button id="closeAddAccountButton" type="button" class="users-modal-close" aria-label="閉じる">&times;</button>

    <h2 id="addAccountTitle" class="users-verify-title">
      アカウントを追加
    </h2>

    <div class="users-add-fields">
      <div class="users-add-input-group">
        <label for="addAccountEmail">メールアドレス</label>
        <input id="addAccountEmail" type="email" autocomplete="email" placeholder="example@example.com" maxlength="254"
          required autofocus aria-describedby="addAccountEmail-error">
        <div id="addAccountEmail-error" class="users-add-input-error" role="alert"></div>
      </div>

      <div class="users-add-input-group">
        <label for="addAccountPassword">パスワード</label>

        <div class="users-add-password-field">
          <input id="addAccountPassword" type="password" autocomplete="new-password" placeholder="パスワード" minlength="4"
            maxlength="64" required aria-describedby="addAccountPassword-error">

          <button id="revealAddAccountPassword" type="button" class="users-add-password-reveal"
            aria-label="押している間だけパスワードを表示" aria-controls="addAccountPassword">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
              aria-hidden="true" focusable="false">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        <div id="addAccountPassword-error" class="users-add-input-error" role="alert"></div>
      </div>

      <div class="users-add-input-group">
        <label for="addAccountName">ユーザー名</label>
        <input id="addAccountName" type="text" autocomplete="nickname" placeholder="ユーザー名" maxlength="32" required
          aria-describedby="addAccountName-error">
        <div id="addAccountName-error" class="users-add-input-error" role="alert"></div>
      </div>
    </div>

    <div class="users-modal-buttons">
      <button id="createAccountButton" type="button" class="users-action-button users-add-button">
        作成
      </button>

      <button id="cancelAddAccountButton" type="button" class="users-action-button users-modal-cancel">
        キャンセル
      </button>
    </div>
  </dialog>

  <!-- 承認モーダル -->
  <dialog id="verifyUserModal" class="users-verify-modal" aria-labelledby="verifyUserTitle"
    aria-describedby="verifyUserMessage">
    <button id="closeVerifyUserButton" type="button" class="users-modal-close" aria-label="閉じる">×</button>

    <h2 id="verifyUserTitle" class="users-verify-title">
      承認確認
    </h2>

    <div id="verifyUserMessage" class="users-verify-message">
      <div id="verifyUserName"></div>
      <div id="verifyUserEmail"></div>
      <p>を承認しますか？</p>
    </div>

    <div class="users-modal-buttons">
      <button id="verifyAsStaffButton" type="button" class="users-action-button users-verify-button">はい（スタッフ）</button>

      <button id="verifyAsViewerButton" type="button" class="users-action-button users-verify-button">はい（閲覧専用）</button>

      <button id="rejectVerifyUserButton" type="button" class="users-action-button users-reset-button">いいえ</button>

      <button id="cancelVerifyUserButton" type="button" class="users-action-button users-modal-cancel"
        autofocus>キャンセル</button>
    </div>
  </dialog>

  <!-- ユーザー設定変更モーダル -->
  <dialog id="userSettingsModal" class="users-verify-modal" aria-labelledby="userSettingsTitle">
    <button id="closeUserSettingsButton" type="button" class="users-modal-close" aria-label="閉じる">&times;</button>

    <h2 id="userSettingsTitle" class="users-verify-title">
      ユーザー設定変更
    </h2>

    <dl class="users-settings-details">
      <dt>ユーザーID</dt>
      <dd id="userSettingsUserId"></dd>

      <dt><label for="userSettingsCircleId">作サーID</label></dt>
      <dd><input id="userSettingsCircleId" type="text" class="users-settings-input"></dd>

      <dt><label for="userSettingsName">名前</label></dt>
      <dd><input id="userSettingsName" type="text" class="users-settings-input"></dd>

      <dt>メールアドレス</dt>
      <dd id="userSettingsEmail"></dd>

      <dt id="userSettingsRoleLabel">ロール</dt>
      <dd>
        <div class="users-settings-options" role="radiogroup" aria-labelledby="userSettingsRoleLabel">
          <label>
            <input type="radio" name="userSettingsRole" value="admin">
            管理者
          </label>
          <label>
            <input type="radio" name="userSettingsRole" value="staff">
            スタッフ
          </label>
          <label>
            <input type="radio" name="userSettingsRole" value="viewer">
            閲覧専用
          </label>
        </div>
      </dd>

      <dt id="userSettingsStatusLabel">ステータス</dt>
      <dd>
        <div class="users-settings-options" role="radiogroup" aria-labelledby="userSettingsStatusLabel">
          <label>
            <input type="radio" name="userSettingsStatus" value="active">
            有効
          </label>
          <label>
            <input type="radio" name="userSettingsStatus" value="inactive">
            無効
          </label>
        </div>
      </dd>
    </dl>

    <div class="users-modal-buttons">
      <button id="confirmUserSettingsButton" type="button" class="users-action-button users-settings-button">変更</button>

      <button id="cancelUserSettingsButton" type="button" class="users-action-button users-modal-cancel"
        autofocus>キャンセル</button>
    </div>
  </dialog>

  <!-- パスワードリセットモーダル -->
  <dialog id="resetPasswordModal" class="users-verify-modal" aria-labelledby="resetPasswordTitle"
    aria-describedby="resetPasswordMessage">
    <button id="closeResetPasswordButton" type="button" class="users-modal-close" aria-label="閉じる">×</button>

    <h2 id="resetPasswordTitle" class="users-verify-title">
      パスワードリセット
    </h2>

    <div id="resetPasswordMessage" class="users-verify-message">
      <div id="resetPasswordName"></div>
      <div id="resetPasswordEmail"></div>

      <p>
        のパスワードリセットリクエストが<br>
        <span id="resetPasswordRequestedAt"></span><br>
        に送信されました。パスワードをリセットしますか？
      </p>
    </div>

    <div class="users-modal-buttons">
      <button id="confirmResetPasswordButton" type="button" class="users-action-button users-reset-button">リセット</button>
      <button id="rejectResetPasswordButton" type="button" class="users-action-button users-reset-button">拒否</button>
      <button id="cancelResetPasswordButton" type="button" class="users-action-button users-modal-cancel"
        autofocus>キャンセル</button>
    </div>
  </dialog>

  <!-- パスワード発行モーダル -->
  <dialog id="issuedPasswordModal" class="users-verify-modal" aria-labelledby="issuedPasswordTitle"
    aria-describedby="issuedPasswordMessage">
    <h2 id="issuedPasswordTitle" class="users-verify-title">
      パスワード発行
    </h2>

    <div id="issuedPasswordMessage" class="issued-password-message">
      <p>パスワードを変更しました。</p>
      <p>下記パスワードをユーザーに共有してください。</p>
      <p>
        これは仮パスワードなので、ユーザーにはログイン後に
        パスワードを設定しなおすように依頼してください。
      </p>
    </div>

    <div class="issued-password-box">
      <code id="issuedPasswordValue"></code>
    </div>

    <p id="issuedPasswordWarning" role="status" hidden></p>

    <div class="users-modal-buttons">
      <button id="closeIssuedPasswordButton" type="button" class="users-action-button users-modal-cancel"
        autofocus>閉じる</button>
    </div>
  </dialog>

  <!-- mySupabase生成, ログイン認証 -->
  <script src="auth.js"></script>
  <!-- 共通ヘッダー -->
  <script src="header.js"></script>
  <!-- 共通トースト -->
  <script src="toast.js"></script>


  <!-- users.html専用処理 -->
  <script src="users.js"></script>
</body>

</html>
